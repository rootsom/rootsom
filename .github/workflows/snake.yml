name: generate animated snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  push:
    branches:
      - main
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rootsom
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff2b4a&color_dots=#000000,#0d260f,#145c2b,#1f8f43,#39ff14
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
